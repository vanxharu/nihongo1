<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved palette before first paint, including on offline launches.
      (function () {
        var theme;
        try { theme = localStorage.getItem('nihongo-theme'); } catch (_) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      :root{--ui-canvas:#faf5ed;--ui-ink:#283149;--ui-primary:#c94553;--ui-on-primary:#fffaf4}
      :root[data-theme="dark"]{--ui-canvas:#171d2d;--ui-ink:#fff1df;--ui-primary:#f2b35e;--ui-on-primary:#292334}
      body{background:var(--ui-canvas);color:var(--ui-ink)}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NihonGo! | Học tiếng Nhật</title>
    <meta name="description" content="Nền tảng học tiếng Nhật & Luyện thi JLPT thông minh theo chuẩn bản xứ, hỗ trợ làm bài tập viết tay bằng bút cảm ứng và chấm điểm nét chữ bằng AI, ôn tập từ vựng, ngữ pháp, Hán tự Kanji, thi thử và Chat AI." />
    <meta property="og:title" content="NihonGo! | Học tiếng Nhật" />
    <meta property="og:site_name" content="NihonGo!" />
    <meta property="og:description" content="Nền tảng học tiếng Nhật & Luyện thi JLPT thông minh theo chuẩn bản xứ, hỗ trợ làm bài tập viết tay bằng bút cảm ứng và chấm điểm nét chữ bằng AI, ôn tập từ vựng, ngữ pháp, Hán tự Kanji, thi thử và Chat AI." />

    <link rel="apple-touch-icon" href="/brand/nihon-shiba-2026-corrected.png" />

    <link rel="preload" href="/mascot-idle.webp" as="image" type="image/webp" />

    <!-- Google Fonts for Authentic JLPT Exam Booklets & Vietnamese Handwriting -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=Itim&family=Klee+One:wght@400;600&family=Mali:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700;900&family=Pangolin&family=Patrick+Hand&family=Shippori+Mincho:wght@400;500;600;700;800&family=Yomogi&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Outfit:wght@400;500;600;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Never refresh the whole page automatically: doing so can erase an unfinished lesson/exam.
      // If initial JavaScript loading genuinely fails, show a user-controlled recovery action.
      (() => {
        window.nihongoRefreshPage = () => window.location.reload();

        let recoveryScheduled = false;
        const showManualRecovery = () => {
          if (window.nihongoStarted) return;
          const root = document.getElementById('root');
          // Don't overwrite React's own error boundary or an app that is still rendering.
          if (!root || root.childElementCount > 0 || root.dataset.recoveryShown) return;
          root.dataset.recoveryShown = 'true';

          const panel = document.createElement('section');
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'max-width:440px;margin:12vh auto;padding:24px;border-radius:16px;border:1px solid #64748b;background:var(--ui-canvas);color:var(--ui-ink);font-family:system-ui,sans-serif;text-align:center;line-height:1.6';
          const heading = document.createElement('h2');
          heading.textContent = 'Không thể tải ứng dụng';
          heading.style.cssText = 'font-size:20px;font-weight:700;margin:0 0 8px';
          const note = document.createElement('p');
          note.textContent = 'Kết nối hoặc dữ liệu vừa cập nhật có thể bị gián đoạn. Trang sẽ không tự tải lại để tránh mất bài đang làm.';
          note.style.cssText = 'font-size:14px;margin:0 0 16px';
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Thử tải lại';
          button.style.cssText = 'background:#4f46e5;color:white;border:0;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer';
          button.addEventListener('click', () => window.nihongoRefreshPage());
          panel.append(heading, note, button);
          root.appendChild(panel);
        };
        const reportBootstrapFailure = () => {
          if (recoveryScheduled || window.nihongoStarted) return;
          recoveryScheduled = true;
          setTimeout(showManualRecovery, 1500);
        };

        window.addEventListener('vite:preloadError', reportBootstrapFailure);
        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') {
            reportBootstrapFailure();
          } else if (!window.nihongoStarted && event.filename &&
                     /\\/(?:assets|src)\\//.test(event.filename)) {
            reportBootstrapFailure();
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          if (window.nihongoStarted) return;
          const reason = String(event.reason?.message || event.reason || '');
          if (/dynamically imported module|Importing a module script|Loading chunk/i.test(reason)) {
            reportBootstrapFailure();
          }
        });
        window.nihongoAppStarted = () => { window.nihongoStarted = true; };
        // Slow startup may offer a manual retry, but must never trigger a reload itself.
        setTimeout(showManualRecovery, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
