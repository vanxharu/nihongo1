<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved palette before first paint, including on offline launches.
      (function () {
        var theme;
        try { theme = localStorage.getItem('nihongo-theme'); } catch (_) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      :root{--ui-canvas:#faf5ed;--ui-ink:#283149;--ui-primary:#c94553;--ui-on-primary:#fffaf4}
      :root[data-theme="dark"]{--ui-canvas:#171d2d;--ui-ink:#fff1df;--ui-primary:#f2b35e;--ui-on-primary:#292334}
      body{background:var(--ui-canvas);color:var(--ui-ink)}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NihonGo! | Học tiếng Nhật</title>
    <meta name="description" content="Nền tảng học tiếng Nhật & Luyện thi JLPT thông minh theo chuẩn bản xứ, hỗ trợ làm bài tập viết tay bằng bút cảm ứng và chấm điểm nét chữ bằng AI, ôn tập từ vựng, ngữ pháp, Hán tự Kanji, thi thử và Chat AI." />
    <meta property="og:title" content="NihonGo! | Học tiếng Nhật" />
    <meta property="og:site_name" content="NihonGo!" />
    <meta property="og:description" content="Nền tảng học tiếng Nhật & Luyện thi JLPT thông minh theo chuẩn bản xứ, hỗ trợ làm bài tập viết tay bằng bút cảm ứng và chấm điểm nét chữ bằng AI, ôn tập từ vựng, ngữ pháp, Hán tự Kanji, thi thử và Chat AI." />
    
    <!-- PWA Manifest & Android Chrome Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=shiba-2026-corrected" />
    <link rel="apple-touch-icon" href="/brand/nihon-shiba-2026-corrected.png" />
    
    <meta name="theme-color" content="#e11d48" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NihonGo!" />
    <meta name="application-name" content="NihonGo!" />

    <!-- Preload key assets -->
    <link rel="preload" href="/mascot-idle.webp" as="image" type="image/webp" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Google Fonts for Authentic JLPT Exam Booklets & Vietnamese Handwriting -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=Itim&family=Klee+One:wght@400;600&family=Mali:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700;900&family=Pangolin&family=Patrick+Hand&family=Shippori+Mincho:wght@400;500;600;700;800&family=Yomogi&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="boot-status" role="status" style="position:fixed;inset:0;z-index:99999;display:grid;place-content:center;text-align:center;padding:24px;background:var(--ui-canvas);color:var(--ui-ink);font:16px system-ui">
      <h1 style="font-size:24px">NihonGo!</h1>
      <p id="boot-message">Đang mở trang học…</p>
      <button id="boot-retry" style="padding:12px 20px;border:0;border-radius:12px;background:var(--ui-primary);color:var(--ui-on-primary);font:inherit;cursor:pointer">Tải lại trang</button>
      <noscript>Vui lòng bật JavaScript để sử dụng trang học.</noscript>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const status = document.getElementById('boot-status');
        const message = document.getElementById('boot-message');
        let recovering = false;
        const refresh = () => {
          const url = new URL(location.href);
          url.searchParams.set('__refresh', Date.now().toString());
          location.replace(url.href);
        };
        window.nihongoRefreshPage = refresh;
        window.nihongoRecoverModule = () => {
          if (recovering || navigator.onLine === false) return false;
          try {
            const last = Number(sessionStorage.getItem('nihongo_module_recovery') || 0);
            if (Date.now() - last < 600000) return false;
            sessionStorage.setItem('nihongo_module_recovery', Date.now().toString());
          } catch { return false; }
          recovering = true;
          refresh();
          return true;
        };
        const failed = () => {
          status.style.display = 'grid';
          message.textContent = navigator.onLine === false ? 'Bạn đang mất kết nối. Hãy kết nối mạng rồi tải lại trang.' : 'Trang chưa tải được. Bạn có thể thử tải lại.';
        };
        document.getElementById('boot-retry').onclick = refresh;
        window.addEventListener('vite:preloadError', () => window.nihongoRecoverModule());
        window.addEventListener('error', event => {
          if (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module') {
            failed(); window.nihongoRecoverModule();
          } else if (!window.nihongoStarted) failed();
        }, true);
        window.addEventListener('unhandledrejection', () => { if (!window.nihongoStarted) failed(); });
        window.nihongoAppStarted = () => { window.nihongoStarted = true; status.style.display = 'none'; };
        setTimeout(() => { if (!window.nihongoStarted) failed(); }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
