name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'public/manifest.json', 'public/.well-known/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/
            public/manifest.json
            public/.well-known/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > nihongo-release.jks
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets not set: signing with a throwaway TEST key (URL bar shown, cannot update an installed app)."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore nihongo-release.jks -alias nihongo -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$PW" -keypass "$PW" -dname "CN=NihonGo test" > /dev/null
            echo "password=$PW" >> "$GITHUB_OUTPUT"
            echo "kind=test" >> "$GITHUB_OUTPUT"
          fi
      - name: Check key matches assetlinks.json
        env:
          PW: ${{ steps.key.outputs.password }}
        run: |
          FP=$(keytool -list -v -keystore android/nihongo-release.jks -storepass "$PW" -alias nihongo | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signing key SHA-256: $FP"
          if grep -q "$FP" public/.well-known/assetlinks.json; then echo "assetlinks.json matches"; else echo "::warning::assetlinks.json does not list this key"; fi
      - name: Generate project and build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.key.outputs.password }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.key.outputs.password }}
        run: |
          cd android
          # Bubblewrap generates the Gradle project from twa-manifest.json; the APK is then built with
          # Gradle and signed with apksigner directly (bubblewrap build rejects the runner's SDK layout).
          bubblewrap update --skipVersionUpgrade
          # Native additions: vocabulary widget + daily word notification (android/overlay).
          node overlay/apply.mjs
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" app-release-aligned.apk
          "$BT/apksigner" sign --ks nihongo-release.jks --ks-key-alias nihongo \
            --ks-pass env:BUBBLEWRAP_KEYSTORE_PASSWORD --key-pass env:BUBBLEWRAP_KEY_PASSWORD \
            --out app-release-signed.apk app-release-aligned.apk
          VERSION=$(node -p "require('./twa-manifest.json').appVersionName")
          mkdir -p ../out
          cp app-release-signed.apk "../out/NihonGo-${VERSION}-${{ steps.key.outputs.kind }}.apk"
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E "SHA-256|Signer"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "Components:"; "$AAPT2" dump xmltree --file AndroidManifest.xml out/*.apk | grep -E 'VocabWidgetProvider|DailyWord|appwidget|POST_NOTIFICATIONS|BOOT_COMPLETED' | sed 's/^ *//'
          unzip -l out/*.apk | grep -E 'assets/words.json|widget_vocab'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: NihonGo-apk
          path: out/*.apk
          retention-days: 14
      - name: Publish to release android-latest
        if: github.ref == 'refs/heads/main' && steps.key.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create android-latest -R "$GITHUB_REPOSITORY" --title "NihonGo! Android (APK)" --target "$GITHUB_SHA" \
              --notes "Bản APK mới nhất. Tải file .apk bên dưới về điện thoại Android và mở để cài (cho phép cài từ nguồn không xác định)."
          gh release upload android-latest out/*.apk -R "$GITHUB_REPOSITORY" --clobber

  # Installs the APK on an Android 13 emulator and checks the native parts at runtime:
  # daily-word alarm scheduled at process start, notification posted, widget provider registered, no crash.
  emulator-smoke:
    needs: apk
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NihonGo-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/*.apk
            adb shell pm grant app.nihongo.study android.permission.POST_NOTIFICATIONS
            adb logcat -c
            # Launch the app: DailyWordInit runs at process start and schedules the 20:00 alarm.
            adb shell monkey -p app.nihongo.study -c android.intent.category.LAUNCHER 1 ; sleep 8
            # The receivers are not exported (only the alarm's PendingIntent may call them): use root, which
            # Android allows to reach non-exported components. -f 32 = FLAG_INCLUDE_STOPPED_PACKAGES.
            adb root ; sleep 3 ; adb wait-for-device
            adb shell am broadcast -f 32 -a app.nihongo.study.DAILY_WORD -n app.nihongo.study/.DailyWord ; sleep 4
            echo "== alarm (scheduled by DailyWordInit at process start)"; adb shell dumpsys alarm | grep -B1 -A4 "app.nihongo.study" | head -10
            adb shell dumpsys alarm | grep -q "app.nihongo.study" || echo "::warning::daily alarm not found in dumpsys alarm"
            echo "== notification"; adb shell dumpsys notification --noredact | grep -A25 "pkg=app.nihongo.study" | grep -E "android.title|android.text|android.subText|channel" | head -8
            adb shell dumpsys notification --noredact | grep -q "pkg=app.nihongo.study" || { echo "::error::daily word notification not posted"; adb logcat -d | grep -iE "nihongo|AndroidRuntime" | tail -40; exit 1; }
            echo "== widget"; adb shell dumpsys appwidget | grep -A4 "app.nihongo.study/.VocabWidgetProvider" | head -6
            adb shell dumpsys appwidget | grep -q "VocabWidgetProvider" || { echo "::error::widget provider not registered"; exit 1; }
            adb shell am broadcast -f 32 -a app.nihongo.study.widget.NEXT -n app.nihongo.study/.VocabWidgetProvider ; sleep 2
            adb shell am broadcast -f 32 -a app.nihongo.study.widget.ROTATE -n app.nihongo.study/.VocabWidgetProvider ; sleep 2
            echo "== crashes"; adb logcat -d -b crash | tee crash.txt | head -30
            if grep -q "app.nihongo.study" crash.txt; then echo "::error::app crashed"; exit 1; fi
