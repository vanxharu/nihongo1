name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npx tsx --test tests/*.test.ts
      - name: Server bundle
        run: npm run build:api
      # api/_lib/server.cjs is what Vercel runs: keep the committed copy in sync with server.ts.
      - name: Commit rebuilt server bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet api/_lib/server.cjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/_lib/server.cjs
            git commit -m "Rebuild api/_lib/server.cjs (npm run build:api)"
            git push
          fi
