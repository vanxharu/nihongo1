<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Deep Japanese Navy/Indigo with Vermilion Glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Outer Border Japanese Gold & Crimson Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Crimson Daruma Body Gradient (Shu-iro / Traditional Vermilion Red) -->
    <linearGradient id="darumaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Golden Headband / Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Rising Sun Gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="70%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </radialGradient>

    <!-- Mount Fuji Snow & Silhouette Gradients -->
    <linearGradient id="fujiBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Border Japanese Crest Stroke -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.85" />

  <!-- JAPANESE RISING SUN (HINOMARU) AURA -->
  <circle cx="256" cy="180" r="140" fill="url(#sunGrad)" opacity="0.85" filter="url(#softGlow)" />
  <circle cx="256" cy="180" r="140" fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="6 6" opacity="0.5" />

  <!-- MOUNT FUJI (富士山) SILHOUETTE IN SUN -->
  <g opacity="0.35">
    <path d="M 120 280 L 220 165 L 292 165 L 392 280 Z" fill="#0F172A" />
    <!-- Snow peak -->
    <path d="M 220 165 L 235 185 L 245 175 L 256 190 L 267 175 L 277 185 L 292 165 Z" fill="#FFFFFF" />
  </g>

  <!-- TORII GATE (鳥居) SUBTLE OUTLINE -->
  <g opacity="0.4" stroke="#FFE4E6" stroke-width="3" stroke-linecap="round">
    <!-- Top curved beam -->
    <path d="M 170 120 Q 256 108 342 120" fill="none" />
    <path d="M 180 135 L 332 135" fill="none" stroke-width="2.5" />
    <!-- Pillars -->
    <line x1="200" y1="135" x2="195" y2="220" />
    <line x1="312" y1="135" x2="317" y2="220" />
  </g>

  <!-- FLOATING SAKURA (桜) PETALS -->
  <g filter="url(#dropShadow)">
    <!-- Top Left Sakura Blossom -->
    <g transform="translate(85, 95) scale(0.9)">
      <path d="M0,0 C-10,-20 10,-20 0,0 C20,-10 20,10 0,0 C10,20 -10,20 0,0 C-20,10 -20,-10 0,0" fill="url(#sakuraGrad)" />
      <circle cx="0" cy="0" r="3" fill="#F43F5E" />
    </g>
    <!-- Top Right Sakura Blossom -->
    <g transform="translate(425, 90) scale(0.85) rotate(25)">
      <path d="M0,0 C-10,-20 10,-20 0,0 C20,-10 20,10 0,0 C10,20 -10,20 0,0 C-20,10 -20,-10 0,0" fill="url(#sakuraGrad)" />
      <circle cx="0" cy="0" r="3" fill="#F43F5E" />
    </g>
    <!-- Tiny Petals Floating -->
    <path d="M 100 210 Q 112 215 110 225 Q 100 225 100 210 Z" fill="#FDA4AF" opacity="0.9" />
    <path d="M 405 220 Q 418 226 415 236 Q 403 234 405 220 Z" fill="#FDA4AF" opacity="0.9" />
    <path d="M 75 300 Q 88 305 84 316 Q 72 312 75 300 Z" fill="#FDA4AF" opacity="0.8" />
    <path d="M 435 310 Q 445 318 440 328 Q 430 322 435 310 Z" fill="#FDA4AF" opacity="0.8" />
  </g>

  <!-- MAIN AUSPICIOUS DARUMA DOLL (達磨 - SYMBOL OF JLPT MASTERY & SUCCESS) -->
  <g transform="translate(0, 15)" filter="url(#dropShadow)">
    
    <!-- DARUMA MAIN ROUND BODY -->
    <ellipse cx="256" cy="275" rx="135" ry="128" fill="url(#darumaRed)" stroke="#BE123C" stroke-width="3" />

    <!-- DARUMA WHITE FACE AREA (Heart/Double Oval Shape) -->
    <path d="M 175 235 C 175 180 220 170 256 195 C 292 170 337 180 337 235 C 337 280 295 295 256 295 C 217 295 175 280 175 235 Z" fill="#FFFDF7" stroke="#FBBF24" stroke-width="2.5" />

    <!-- DARUMA GOLDEN HACHIMAKI (VICTORY HEADBAND) -->
    <path d="M 152 188 Q 256 162 360 188 L 358 214 Q 256 190 154 214 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" />
    
    <!-- Headband Ribbon Tails -->
    <path d="M 154 200 Q 125 205 115 228 Q 130 234 150 212 Z" fill="#F59E0B" />
    <path d="M 154 200 Q 120 190 105 208 Q 120 220 148 208 Z" fill="#D97706" />

    <!-- Center Kanji: '必勝' (Sure Victory / Tất Thắng) or '合格' (Pass JLPT) -->
    <circle cx="256" cy="189" r="15" fill="#991B1B" stroke="#FEF08A" stroke-width="1.5" />
    <text x="256" y="195" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="13" fill="#FEF08A" text-anchor="middle">勝</text>

    <!-- TRADITIONAL JAPANESE EYEBROWS (Crane / Feather Style) -->
    <!-- Left Eyebrow -->
    <path d="M 192 214 Q 212 204 236 216 Q 220 216 192 214 Z" fill="#1E293B" />
    <!-- Right Eyebrow -->
    <path d="M 320 214 Q 300 204 276 216 Q 292 216 320 214 Z" fill="#1E293B" />

    <!-- DETERMINED & FRIENDLY ANIME / JAPANESE EYES -->
    <!-- Left Eye (Big Sparkling Eye) -->
    <g>
      <ellipse cx="218" cy="235" rx="14" ry="17" fill="#0F172A" />
      <circle cx="213" cy="228" r="6" fill="#FFFFFF" />
      <circle cx="223" cy="241" r="3" fill="#FFFFFF" />
      <circle cx="223" cy="231" r="2" fill="#E11D48" />
    </g>
    <!-- Right Eye (Big Sparkling Eye) -->
    <g>
      <ellipse cx="294" cy="235" rx="14" ry="17" fill="#0F172A" />
      <circle cx="289" cy="228" r="6" fill="#FFFFFF" />
      <circle cx="299" cy="241" r="3" fill="#FFFFFF" />
      <circle cx="299" cy="231" r="2" fill="#E11D48" />
    </g>

    <!-- ROSY CHEEKS WITH SAKURA TINT -->
    <ellipse cx="196" cy="254" rx="14" ry="9" fill="#FB7185" opacity="0.8" />
    <ellipse cx="316" cy="254" rx="14" ry="9" fill="#FB7185" opacity="0.8" />

    <!-- CUTE MUSTACHE & DETERMINED SMILE -->
    <!-- Whiskers / Mustache (Turtle tail style) -->
    <path d="M 214 266 Q 236 264 246 256" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 298 266 Q 276 264 266 256" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Happy Confident Smile -->
    <path d="M 242 268 Q 256 278 270 268" fill="none" stroke="#991B1B" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="256" cy="272" rx="4" ry="2.5" fill="#E11D48" />

    <!-- DARUMA GOLDEN BELLY PATTERN WITH KANJI '日本' (NIHON) -->
    <!-- Golden Fan/Cloud Border -->
    <path d="M 195 315 Q 256 302 317 315 Q 330 365 310 395 Q 256 408 202 395 Q 182 365 195 315 Z" fill="#991B1B" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Gold Cloud flourishes -->
    <path d="M 205 330 Q 220 322 232 334" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
    <path d="M 307 330 Q 292 322 280 334" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />

    <!-- Kanji '日本語' (Nihon / Nihongo) in Gold Calligraphy -->
    <text x="256" y="362" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="900" font-size="34" fill="#FEF08A" text-anchor="middle" filter="url(#softGlow)" letter-spacing="2">日本語</text>

    <!-- Tiny Auspicious Gold Dots -->
    <circle cx="230" cy="385" r="3" fill="#FDE047" />
    <circle cx="256" cy="388" r="4" fill="#FDE047" />
    <circle cx="282" cy="385" r="3" fill="#FDE047" />
  </g>

  <!-- BOTTOM JAPANESE CALLIGRAPHY BRAND PILL -->
  <g transform="translate(256, 475)">
    <rect x="-85" y="-18" width="170" height="28" rx="14" fill="#1E1B4B" stroke="#E11D48" stroke-width="2" />
    <text x="0" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#FDA4AF" text-anchor="middle" letter-spacing="1">NIHONGO 🌸</text>
  </g>
</svg>
