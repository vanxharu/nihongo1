<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Lacquer Slate to Deep Indigo Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#181A33" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>

    <!-- Outer Rim Glowing Gradient -->
    <linearGradient id="icon-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Rising Sun Crimson Vermilion Gradient -->
    <linearGradient id="icon-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Auspicious Japanese Gold Gradient -->
    <linearGradient id="icon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Mount Fuji Shading Gradient -->
    <linearGradient id="icon-fuji" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Soft Radial Sun Aura Glow -->
    <radialGradient id="icon-aura" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#FF385C" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#E11D48" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#icon-bg)" />

  <!-- Outer Japanese Crest Dual Border -->
  <rect 
    x="14" 
    y="14" 
    width="484" 
    height="484" 
    rx="114" 
    fill="none" 
    stroke="url(#icon-rim)" 
    stroke-width="8" 
    stroke-opacity="0.85" 
  />

  <!-- Sun Aura Ambient Glow -->
  <circle cx="256" cy="235" r="210" fill="url(#icon-aura)" />

  <!-- Center Sacred Japanese Rising Sun (Hinomaru) -->
  <g filter="url(#icon-shadow)">
    <circle cx="256" cy="235" r="165" fill="url(#icon-sun)" />
    
    <!-- Delicate Concentric Auspicious Gold Dashed Ring -->
    <circle 
      cx="256" 
      cy="235" 
      r="165" 
      fill="none" 
      stroke="#FEF08A" 
      stroke-width="3" 
      stroke-dasharray="10 8" 
      stroke-opacity="0.6" 
    />
  </g>

  <!-- Mount Fuji (富士山) Silhouette at the Dawn Horizon -->
  <g id="icon-mt-fuji">
    <path 
      d="M 125 350 L 215 230 L 297 230 L 387 350 Z" 
      fill="url(#icon-fuji)" 
    />
    <!-- Sacred Snow Peak -->
    <path 
      d="M 215 230 L 230 256 L 245 246 L 256 262 L 267 246 L 282 256 L 297 230 Z" 
      fill="#FFFFFF" 
      opacity="0.95" 
    />
  </g>

  <!-- Gateway of Wisdom (Torii Gate & Open Book of Scholarship) -->
  <g id="icon-torii-gate" filter="url(#icon-shadow)">
    <!-- Upper Kasagi Beam (Arching gracefully like the wings of an open book) -->
    <path 
      d="M 85 162 C 145 132, 215 142, 256 149 C 297 142, 367 132, 427 162 C 387 172, 317 162, 256 169 C 195 162, 125 172, 85 162 Z" 
      fill="#FFFFFF" 
    />

    <!-- Kasagi Golden Accent Line -->
    <path 
      d="M 125 152 Q 256 140 387 152" 
      stroke="url(#icon-gold)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />

    <!-- Second Horizontal Beam (Shimaki / Nuki) -->
    <path 
      d="M 120 195 L 392 195" 
      stroke="#FFFFFF" 
      stroke-width="16" 
      stroke-linecap="round" 
    />

    <!-- Central Signet Tablet (Gakuzuka) with Golden Accent -->
    <rect 
      x="238" 
      y="160" 
      width="36" 
      height="40" 
      rx="6" 
      fill="url(#icon-gold)" 
      stroke="#991B1B" 
      stroke-width="3" 
    />
    <line x1="244" y1="180" x2="268" y2="180" stroke="#991B1B" stroke-width="3.5" />

    <!-- Main Vertical Pillars (Hashira) -->
    <path 
      d="M 160 162 L 150 355" 
      stroke="#FFFFFF" 
      stroke-width="20" 
      stroke-linecap="round" 
    />
    <path 
      d="M 352 162 L 362 355" 
      stroke="#FFFFFF" 
      stroke-width="20" 
      stroke-linecap="round" 
    />

    <!-- Stone Pedestals (Kamebara / Daiishi) -->
    <path 
      d="M 130 355 L 170 355" 
      stroke="#FFFFFF" 
      stroke-width="16" 
      stroke-linecap="round" 
    />
    <path 
      d="M 342 355 L 382 355" 
      stroke="#FFFFFF" 
      stroke-width="16" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Floating Golden Sakura Blossom of JLPT Mastery (Top-Right) -->
  <g id="icon-sakura" transform="translate(370, 105) scale(2.6)" filter="url(#icon-shadow)">
    <circle cx="0" cy="-6" r="3.2" fill="url(#icon-gold)" />
    <circle cx="5.7" cy="-1.8" r="3.2" fill="url(#icon-gold)" />
    <circle cx="3.5" cy="4.8" r="3.2" fill="url(#icon-gold)" />
    <circle cx="-3.5" cy="4.8" r="3.2" fill="url(#icon-gold)" />
    <circle cx="-5.7" cy="-1.8" r="3.2" fill="url(#icon-gold)" />
    <circle cx="0" cy="0" r="2.2" fill="#E11D48" />
  </g>

  <!-- Traditional Inkan Seal & Brand Banner at the Bottom -->
  <g transform="translate(256, 436)" filter="url(#icon-shadow)">
    <rect 
      x="-110" 
      y="-26" 
      width="220" 
      height="52" 
      rx="26" 
      fill="#DC2626" 
      stroke="url(#icon-gold)" 
      stroke-width="3" 
    />
    <text 
      x="0" 
      y="9" 
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-weight="900" 
      font-size="22" 
      fill="#FFFFFF" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      Nihon<tspan fill="#FEF08A">Go!</tspan>
    </text>
  </g>
</svg>
